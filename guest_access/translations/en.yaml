configuration:
  log_level:
    name: Log level
    description: >-
      How much the app writes to its log. At debug, the guest port logs the
      address and proxy headers of each request.
  public_base_url:
    name: Public address
    description: >-
      The address guests use to reach the guest port, such as
      https://guest.example.com. Link URLs and QR codes start with it.
  local_access:
    name: Local network access
    description: Lets rules require the home network.
    fields:
      enabled:
        name: Turn on "local only"
        description: >-
          Off by default. A guest on your Wi-Fi may still look like an outside
          guest (private relay, custom DNS, VPN). They lose those controls;
          nobody gains any.
      networks:
        name: Home networks
        description: The address ranges that count as home, such as 192.168.0.0/16.
  trusted_proxies:
    name: Trusted proxies
    description: >-
      Proxies whose X-Forwarded-For header the app believes, as IPs or
      ranges. Add your reverse proxy and your tunnel. Leave empty if guests
      reach the app directly.
  home_radius_default_m:
    name: Default home radius
    description: The "near home" radius, in meters, that new rules start with.
  music_assistant:
    name: Music Assistant
    description: Optional. Used for the party link.
    fields:
      url:
        name: Address
        description: Such as http://d5369777-music-assistant:8095.
      token:
        name: Token
        description: A long-lived Music Assistant token.
      timeout_ms:
        name: Timeout
        description: How long to wait for Music Assistant, in milliseconds.
  guest:
    name: Guest page
    description: Plain text only.
    fields:
      title:
        name: Title
      welcome:
        name: Welcome text
      accent_color:
        name: Accent color
        description: "Such as #1e88e5."
      slider_interval_ms:
        name: Slider updates
        description: Least milliseconds between two values the guest page sends while a slider moves.
  location:
    name: Location check
    fields:
      ttl_min:
        name: Location lasts
        description: Minutes a shared location counts before the page asks again.
      max_accuracy_m:
        name: Worst accuracy
        description: The worst location accuracy the app accepts, in meters.
  rate_limits:
    name: Rate limits
    description: Limits per guest, link and app. Over a limit, requests wait.
    fields:
      enabled:
        name: Rate limits on
        description: >-
          Not recommended to turn off. With limits off, nothing slows down
          guesses at links or passwords.
      guest_per_min:
        name: Guest requests per minute
        description: Before a guest opens a link, per address.
      guest_burst:
        name: Guest burst
        description: Requests in a quick row before the per-minute limit applies.
      actions_per_min:
        name: Actions per minute
        description: Per link and address, once the guest is in.
      actions_burst:
        name: Action burst
      continuous_per_min:
        name: Slider actions per minute
        description: Per link, guest and device. Sliders send many values while they move.
      continuous_burst:
        name: Slider burst
      max_streams_per_link:
        name: Live updates per link
        description: Open pages with live updates, per link.
      misses_per_hour_per_ip:
        name: Wrong links per hour, per address
      misses_per_hour_global:
        name: Wrong links per hour, all addresses
        description: Valid links keep working over this limit.
      password_fails_per_ip:
        name: Wrong passwords per address
      password_window_per_ip_min:
        name: Window for wrong passwords per address
        description: In minutes.
      password_fails_per_link:
        name: Wrong passwords per link
      password_window_per_link_min:
        name: Window for wrong passwords per link
        description: In minutes.
      password_lockout_min:
        name: Password lockout
        description: Minutes the password form stays locked after too many wrong passwords.
      admin_per_min:
        name: Admin requests per minute
  links:
    name: Links
    fields:
      custom_slug_min_len:
        name: Shortest custom link name
        description: At least 12 characters.
      custom_slug_max_len:
        name: Longest custom link name
  http:
    name: Request size
    fields:
      guest_body_kib:
        name: Largest guest request
        description: In KiB.
      admin_body_kib:
        name: Largest admin request
        description: In KiB.
  diagnostics:
    name: Diagnostics
    fields:
      requests:
        name: Requests kept
        description: How many recent guest requests the admin page shows.
  inventory:
    name: Entity list
    fields:
      max_age_s:
        name: Refresh after
        description: Seconds to keep the list of entities, devices and areas between updates.
  approval:
    name: Device approval
    fields:
      pending_ttl_min:
        name: Request waits
        description: Minutes a new device waits for approval.
      max_pending:
        name: Waiting devices per link
      max_devices:
        name: Approved devices per link
      events_per_hour:
        name: Approval notices per hour
        description: Per link.
      touch_throttle_min:
        name: Last seen updates
        description: Least minutes between "last seen" updates of a device.
  ha:
    name: Home Assistant calls
    fields:
      call_timeout_s:
        name: Action timeout
        description: Seconds to wait for HA to run a guest action.
      event_timeout_s:
        name: Event timeout
        description: Seconds to wait for HA to take an event the app sends.
  streams:
    name: Live updates
    fields:
      recheck_s:
        name: Check link every
        description: Seconds between checks that an open guest page may still see the link. A revoke ends the page's updates within this time.
      heartbeat_s:
        name: Keep-alive every
        description: Seconds between keep-alive messages, so proxies keep the connection open.
      retry_after_s:
        name: Retry after
        description: Seconds a guest page waits when the link has the most open pages.
  audit:
    name: Audit log
    fields:
      enabled:
        name: Write audit file
        description: Keep a record of guest and admin actions in /data/audit.jsonl. The app log gets each record either way.
      max_file_kib:
        name: Audit file size
        description: KiB at which the audit file starts over. The app keeps one older file.
network:
  8888/tcp: Guest links. Point your reverse proxy here.
